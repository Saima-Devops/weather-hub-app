name: CI / CD
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/app.js
      - run: node --check static/js/trip-planner.js
      - run: node --test tests/test_trip_planner.cjs
      - name: Verify Vercel asset build
        run: |
          python scripts/build_vercel.py
          diff -rq static public/static
      - name: Check that local secrets are not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'Do not commit .env files.'
            exit 1
          fi
      - run: docker build -t weather-hub:test .
      - name: Start production container
        run: |
          docker run -d --name weather-hub-ci -p 127.0.0.1:8000:8000 weather-hub:test
          curl --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 --fail http://127.0.0.1:8000/health
      - name: Smoke-test production container
        run: python scripts/smoke_deployment.py http://127.0.0.1:8000
      - name: Container logs on failure
        if: failure()
        run: docker logs weather-hub-ci || true
      - name: Stop production container
        if: always()
        run: docker rm -f weather-hub-ci || true

  deploy:
    name: Stage production build on Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check deployment credentials
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Pull production settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production deployment
        run: vercel build --prod
      - name: Stage verified production build
        run: vercel deploy --prebuilt --prod --skip-domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
