name: CI / CD
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/app.js
      - run: node --check static/js/trip-planner.js
      - run: node --test tests/test_trip_planner.cjs
      - name: Verify Vercel asset build
        run: |
          python scripts/build_vercel.py
          diff -rq static public/static
      - name: Check that local secrets are not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'Do not commit .env files.'
            exit 1
          fi
      - run: docker build -t weather-hub:test .
      - name: Start production container
        run: |
          docker run -d --name weather-hub-ci -p 127.0.0.1:8000:8000 weather-hub:test
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
      - name: Smoke-test production container
        run: python scripts/smoke_deployment.py http://127.0.0.1:8000
      - name: Container logs on failure
        if: failure()
        run: docker logs weather-hub-ci || true
      - name: Stop production container
        if: always()
        run: docker rm -f weather-hub-ci || true

  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified build
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
